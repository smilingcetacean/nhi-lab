# The vending service — the controller that mints child identities through
# the SPIRE Entry API; the core contribution of this lab.
#
# Namespace `nhi`, service account `vending-service`, therefore SPIFFE ID
# spiffe://lab.local/svc/vending-service (registered by
# scripts/register-entries.sh). That identity is named in the SPIRE server's
# admin_ids, so whatever pod runs under this service account holds unscoped
# SPIRE admin. Keep the service account's use confined to this Deployment.
#
# Three credentials meet in this pod:
#   ingress — parents present a JWT-SVID, audience spiffe://lab.local/svc/vending-service
#   egress  — this service's own X509-SVID to the policy engine
#   egress  — this service's own X509-SVID to the SPIRE server admin API
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vending-service
  namespace: nhi
---
apiVersion: v1
kind: Service
metadata:
  name: vending-service
  namespace: nhi
spec:
  type: ClusterIP
  selector:
    app: vending-service
  ports:
    - name: http
      port: 8090
      targetPort: 8090
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vending-service
  namespace: nhi
  labels:
    app: vending-service
spec:
  replicas: 1
  # Recreate, not the default RollingUpdate: a rolling update starts the new
  # pod before the old one stops, and two pods would then hold the SQLite
  # file (and run two reapers) at once. Recreate stops the old pod first, so
  # there is only ever one writer, at the cost of a few seconds without a
  # vending service on each rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vending-service
  template:
    metadata:
      labels:
        app: vending-service
    spec:
      serviceAccountName: vending-service
      securityContext:
        # Makes the vending-data volume group-owned by the container's GID,
        # whatever the storage class's default ownership is.
        fsGroup: 65532
      containers:
        - name: vending-service
          # Built locally and side-loaded into kind. Not a registry
          # reference: nothing should be able to pull the component holding
          # unscoped SPIRE admin from the internet.
          image: nhi-lab/vending-service:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: LISTEN_ADDR
              value: ":8090"
            - name: VENDING_AUDIENCE
              value: spiffe://lab.local/svc/vending-service
            - name: TRUST_DOMAIN
              value: lab.local
            - name: POLICY_ENGINE_URL
              value: https://policy-engine.nhi.svc.cluster.local:8443
            - name: POLICY_ENGINE_SPIFFE_ID
              value: spiffe://lab.local/svc/policy-engine
            - name: SPIRE_SERVER_ADDR
              value: spire-server.spire.svc.cluster.local:8081
            # SPIRE's own serving SPIFFE ID (distinct from admin_ids, which
            # names the CALLER this service authenticates as). Verified
            # empirically against the running cluster — see
            # src/vending-service/README.md.
            - name: SPIRE_SERVER_SPIFFE_ID
              value: spiffe://lab.local/spire/server
            # Every child entry is parented to the node alias, not
            # an individual agent.
            - name: NODE_ALIAS_SPIFFE_ID
              value: spiffe://lab.local/node/nhi-lab
            - name: DB_PATH
              value: /var/lib/vending-service/vending.db
            # Second audit sink: every event goes to stdout (kubectl logs) and
            # is also appended to this file on the same volume, so the vending
            # service's half of the chain_id trail survives a pod restart.
            # Read it with `make vending-audit`.
            - name: AUDIT_LOG_PATH
              value: /var/lib/vending-service/audit.jsonl
            - name: SPIFFE_ENDPOINT_SOCKET
              value: unix:///run/spire/sockets/agent.sock
            - name: REAPER_INTERVAL
              value: 15s
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
            - name: vending-data
              mountPath: /var/lib/vending-service
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/sockets
            type: DirectoryOrCreate
        # SQLite needs a writable directory, and readOnlyRootFilesystem above
        # keeps it off the container's own filesystem. The volume is a
        # PersistentVolumeClaim (59-vending-data-pvc.yaml), so the delegation
        # records, the replay nonces and audit.jsonl survive a pod restart:
        # disposal through the API, the reaper's work list and replay
        # protection all carry across it. They do not survive deleting the
        # claim or the cluster. The store is a single-writer SQLite file, hence
        # one replica and strategy Recreate.
        - name: vending-data
          persistentVolumeClaim:
            claimName: vending-data
