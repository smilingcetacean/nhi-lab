apiVersion: v1
kind: ServiceAccount
metadata:
  name: spire-server
  namespace: spire
---
# Permissions the SPIRE server needs for k8s_psat node attestation:
#   - tokenreviews: validate the projected service account token the agent
#     presents, including its `spire-server` audience.
#   - pods (get): k8s_psat resolves the token's pod to learn which node it runs
#     on, so the agent's SPIFFE ID can be bound to that node's UID.
#   - nodes (get): resolve the node object referenced by that pod.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spire-server-node-attestor
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spire-server-node-attestor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: spire-server-node-attestor
subjects:
  - kind: ServiceAccount
    name: spire-server
    namespace: spire
---
# The k8sbundle Notifier plugin republishes the trust bundle into the
# `spire-bundle` ConfigMap every time the CA rotates. That ConfigMap is how the
# agent bootstraps trust in the server (see 12-server-bundle-configmap.yaml).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spire-server-bundle-publisher
  namespace: spire
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["spire-bundle"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spire-server-bundle-publisher
  namespace: spire
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spire-server-bundle-publisher
subjects:
  - kind: ServiceAccount
    name: spire-server
    namespace: spire
