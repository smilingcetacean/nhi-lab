apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: spire-agent
  namespace: spire
  labels:
    app: spire-agent
spec:
  selector:
    matchLabels:
      app: spire-agent
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: spire-agent
    spec:
      serviceAccountName: spire-agent
      # hostPID: the workload attestor identifies a caller by inspecting
      #   /proc/<pid> of the calling process, which lives in another pod's PID
      #   namespace. Without hostPID the agent cannot attest anything.
      # hostNetwork: lets the k8s workload attestor reach the node's kubelet on
      #   127.0.0.1:10250.
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: spire-agent
          image: ghcr.io/spiffe/spire-agent:1.15.2
          imagePullPolicy: IfNotPresent
          # The image entrypoint is already `/opt/spire/bin/spire-agent run`.
          args:
            - -config
            - /run/spire/config/agent.conf
          volumeMounts:
            - name: spire-config
              mountPath: /run/spire/config
              readOnly: true
            - name: spire-bundle
              mountPath: /run/spire/bundle
              readOnly: true
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
            - name: spire-agent-data
              mountPath: /run/spire/agent-data
            - name: spire-token
              mountPath: /var/run/secrets/tokens
              readOnly: true
          livenessProbe:
            httpGet:
              path: /live
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        - name: spire-config
          configMap:
            name: spire-agent
        - name: spire-bundle
          configMap:
            name: spire-bundle
        # Workload API socket shared by hostPath, not the SPIFFE CSI
        # driver. Workload pods mount this same path.
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/sockets
            type: DirectoryOrCreate
        - name: spire-agent-data
          hostPath:
            path: /var/lib/spire/agent-data
            type: DirectoryOrCreate
        # Projected service account token for k8s_psat node attestation.
        # `audience` must equal the server's k8s_psat `audience` value.
        - name: spire-token
          projected:
            sources:
              - serviceAccountToken:
                  path: spire-agent
                  expirationSeconds: 7200
                  audience: spire-server
