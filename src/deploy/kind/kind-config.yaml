# kind cluster for the NHI lifecycle lab.
#
# 1 control-plane + 1 worker. The worker exists so that
# node attestation is exercised on more than one node and so that child agent
# pods can be scheduled away from the control plane.
#
# The node image is pinned BY DIGEST, not by tag: kind's default node image
# changes with every kind release, which would silently change the Kubernetes
# version underneath the experiment. v1.36.1 is the image kind v0.32.0 ships.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: nhi-lab
nodes:
  - role: control-plane
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
  - role: worker
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
